# OSV-Scanner suppressions. Auto-discovered next to package-lock.json by the
# OSV Scan workflow (.github/workflows/osv-scan.yml). Each entry must carry a
# reason and a review date so exceptions don't outlive their justification.

# --- dompurify via monaco-editor --------------------------------------------
# monaco-editor 0.57.0 declares `dompurify: 3.4.15` as an exact pin, which is
# what the scanner matches on. monaco never imports that package: it vendors
# its own DOMPurify (also 3.4.15) at esm/vs/base/browser/dompurify/dompurify.js,
# and domSanitize.js imports `./dompurify/dompurify.js`. There is no bare
# `dompurify` import anywhere in monaco's esm/ or min/ output.
#
# The playground bundles monaco (apps/playground/src/lib/monacoLoader.ts), so
# the vendored copy does execute. An npm override would raise the node_modules
# copy that nothing imports and leave the vendored one untouched, turning this
# table green without changing a byte of what executes. That is worse than an
# explicit exception: it hides the exposure instead of recording it. Each
# entry below is checked against monaco's vendored source instead.
#
# Re-evaluate when a monaco-editor release pins dompurify >= 3.4.17.

[[IgnoredVulns]]
id = "GHSA-p98j-92pf-mc4p"
ignoreUntil = 2026-12-01
# Needs IN_PLACE sanitization plus an afterSanitizeElements or
# afterSanitizeAttributes hook that removes a non-root element, leaving the
# detached subtree's event handlers armed on the caller's live DOM. monaco has
# the hook half: domSanitize.js's afterSanitizeAttributes hook can swap a node
# out with replaceChild. It never has the IN_PLACE half: both sanitize() call
# sites pass RETURN_DOM_FRAGMENT or RETURN_TRUSTED_TYPE, and outside the
# vendored dompurify.js, IN_PLACE appears nowhere in monaco's esm/. Without
# IN_PLACE, sanitize works on a fresh document, so no live subtree is involved.
reason = "monaco vendors its own DOMPurify; flagged node_modules copy is never imported; IN_PLACE never set, so no live subtree can be left armed"

[[IgnoredVulns]]
id = "GHSA-6688-9rhm-gjv2"
ignoreUntil = 2026-12-01
# Needs sanitize(node, { IN_PLACE: true }) on a Node input whose root is a
# rawtext element. Same missing half as above: monaco 0.57.0's two call sites
# in domSanitize.js pass an HTML string with RETURN_DOM_FRAGMENT or
# RETURN_TRUSTED_TYPE, and IN_PLACE appears nowhere in esm/ outside the
# vendored dompurify.js.
reason = "monaco vendors its own DOMPurify; flagged node_modules copy is never imported; sanitize gets strings and never IN_PLACE"

[[IgnoredVulns]]
id = "GHSA-mrv2-3pqr-j5jr"
ignoreUntil = 2026-12-01
# The incomplete-fix follow-up to GHSA-p98j-92pf-mc4p: an IN_PLACE hook that
# removes the current node's parent or a later sibling leaves that subtree's
# handlers armed. Same missing half as GHSA-p98j-92pf-mc4p: no IN_PLACE.
reason = "monaco vendors its own DOMPurify; flagged node_modules copy is never imported; IN_PLACE never set, so no live subtree can be left armed"

[[IgnoredVulns]]
id = "GHSA-cg2g-xh64-v4q7"
ignoreUntil = 2026-12-01
# Needs SAFE_FOR_TEMPLATES with a DOM-returning mode, on input that carries an
# attached shadow root, whose output then feeds a template engine. monaco has
# the DOM-returning half (RETURN_DOM_FRAGMENT), but SAFE_FOR_TEMPLATES appears
# nowhere in esm/ outside the vendored dompurify.js, and both call sites pass
# a string, which DOMPurify parses without declarative shadow roots.
reason = "monaco vendors its own DOMPurify; flagged node_modules copy is never imported; SAFE_FOR_TEMPLATES never set"

[[IgnoredVulns]]
id = "GHSA-c6gr-qvv4-5v3f"
ignoreUntil = 2026-12-01
# Needs PARSER_MEDIA_TYPE 'application/xhtml+xml' plus an allowlist that keeps
# animate/set and attributeName. PARSER_MEDIA_TYPE appears nowhere in esm/
# outside the vendored dompurify.js, so monaco parses as text/html, where the
# attributeName=href guard lowercases correctly.
reason = "monaco vendors its own DOMPurify; flagged node_modules copy is never imported; PARSER_MEDIA_TYPE never set, so the guard runs in text/html mode"

# --- minimatch via eslint, typedoc, typescript-eslint (dev tooling) ---------
# Fixed only in minimatch 11.0.1, and the npm latest of every parent still
# declares ^10: eslint ^10.2.6, @eslint/config-array ^10.2.4, typedoc ^10.2.5,
# @typescript-eslint/typescript-estree ^10.2.2. An override would force all
# four onto an unvetted major.
#
# Re-evaluate when those parents accept minimatch >= 11.0.1, or a patched 10.x
# ships.

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2026-12-01
# Needs an attacker-supplied glob compiled with optimizationLevel >= 2: the
# globParts amplification (firstPhasePreProcess) and the quadratic pairwise
# pass (secondPhasePreProcess) both run only behind that check in minimatch's
# preprocess(). None of the four parents passes optimizationLevel, so they all
# take the default level 1 path (levelOneOptimize). Every glob they compile
# comes from config authored in this repo.
reason = "dev-only lint/docs tooling; no consumer sets optimizationLevel >= 2, the only path that amplifies globParts; globs are repo-authored"
