# OSV-Scanner suppressions. Auto-discovered next to package-lock.json by the
# OSV Scan workflow (.github/workflows/osv-scan.yml). Each entry must carry a
# reason and a review date so exceptions don't outlive their justification.

# --- dompurify via monaco-editor --------------------------------------------
# monaco-editor 0.57.0 declares `dompurify: 3.4.15` as an exact pin, which is
# what the scanner matches on. monaco never imports that package: it vendors
# its own DOMPurify (also 3.4.15) at esm/vs/base/browser/dompurify/dompurify.js,
# and domSanitize.js imports `./dompurify/dompurify.js`. There is no bare
# `dompurify` import anywhere in monaco's esm/ or min/ output.
#
# The playground bundles monaco (apps/playground/src/lib/monacoLoader.ts), so
# the vendored copy does execute. An npm override would raise the node_modules
# copy that nothing imports and leave the vendored one untouched, turning this
# table green without changing a byte of what executes. That is worse than an
# explicit exception: it hides the exposure instead of recording it. Each
# entry below is checked against monaco's vendored source instead.
#
# Re-evaluate when a monaco-editor release pins dompurify >= 3.4.16.

[[IgnoredVulns]]
id = "GHSA-p98j-92pf-mc4p"
ignoreUntil = 2026-11-01
# Needs IN_PLACE sanitization plus an afterSanitizeElements or
# afterSanitizeAttributes hook that removes a non-root element, leaving the
# detached subtree's event handlers armed on the caller's live DOM. monaco has
# the hook half: domSanitize.js's afterSanitizeAttributes hook can swap a node
# out with replaceChild. It never has the IN_PLACE half: both sanitize() call
# sites pass RETURN_DOM_FRAGMENT or RETURN_TRUSTED_TYPE, and outside the
# vendored dompurify.js, IN_PLACE appears nowhere in monaco's esm/. Without
# IN_PLACE, sanitize works on a fresh document, so no live subtree is involved.
reason = "monaco vendors its own DOMPurify; flagged node_modules copy is never imported; IN_PLACE never set, so no live subtree can be left armed"

[[IgnoredVulns]]
id = "GHSA-6688-9rhm-gjv2"
ignoreUntil = 2026-11-01
# Needs sanitize(node, { IN_PLACE: true }) on a Node input whose root is a
# rawtext element. Same missing half as above: monaco 0.57.0's two call sites
# in domSanitize.js pass an HTML string with RETURN_DOM_FRAGMENT or
# RETURN_TRUSTED_TYPE, and IN_PLACE appears nowhere in esm/ outside the
# vendored dompurify.js.
reason = "monaco vendors its own DOMPurify; flagged node_modules copy is never imported; sanitize gets strings and never IN_PLACE"

# --- katex via mermaid (docs site) ------------------------------------------
# Fixed only in katex 0.18.2, and mermaid (11.17.2 here, 12.1.0 latest) still
# declares katex ^0.16.47, so the fix is outside the parent's range. An
# override would force mermaid onto an unvetted katex line.
#
# Re-evaluate when a mermaid release accepts katex >= 0.18.2.

[[IgnoredVulns]]
id = "GHSA-238p-pmpm-9mq7"
ignoreUntil = 2026-12-01
# A read-side gadget: needs Object.prototype already polluted by some other
# bug before KaTeX reads options. KaTeX is dev-only (apps/docs via
# vitepress-plugin-mermaid), and mermaid dynamically imports it only for a
# diagram label matching $$...$$. No docs page contains one, and every diagram
# is authored in-repo.
reason = "docs-only via mermaid; loaded only for $$ math labels, which no page has; needs a separate prototype-pollution bug"
