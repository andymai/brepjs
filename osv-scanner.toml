# OSV-Scanner suppressions. Auto-discovered next to package-lock.json by the
# OSV Scan workflow (.github/workflows/osv-scan.yml). Each entry must carry a
# reason and a review date so exceptions don't outlive their justification.

[[IgnoredVulns]]
id = "GHSA-gv7w-rqvm-qjhr"
ignoreUntil = 2026-09-15
# esbuild 0.25.10 reaches the tree only via vitepress -> vite@6.4.x, a dev-only
# docs-site build dependency. The advisory is the Deno install path trusting a
# malicious NPM_CONFIG_REGISTRY; not reachable from our Node-only trusted CI
# build. The fix (esbuild 0.28.1) drops destructuring->es2020 transform support
# and breaks the vitepress build, and vitepress' stable line still pins vite
# 6.x. Re-evaluate once vitepress 2.x (newer vite/esbuild) ships.
reason = "esbuild dev-only via vitepress; Deno/NPM_CONFIG_REGISTRY vector not reachable in Node CI; fix breaks docs build"

# --- dompurify via monaco-editor (3 advisories) ---------------------------
# monaco-editor 0.56.0 (latest; no newer release) declares `dompurify: 3.4.8`
# as an exact pin, which is what the scanner matches on. That copy is never
# loaded: monaco vendors its own DOMPurify at
# esm/vs/base/browser/dompurify/dompurify.js (license header: DOMPurify 3.4.8)
# and domSanitize.js imports `./dompurify/dompurify.js`. There is no bare
# `dompurify` import anywhere in monaco's esm/ or min/ output.
#
# So an npm override would raise the unused node_modules copy and turn this
# table green while the vendored copy actually shipped in the playground
# bundle stayed at 3.4.8. That is worse than an explicit exception: it hides
# the exposure instead of recording it. Bumping monaco is the only real fix
# and upstream has not shipped one.
#
# All three advisories need a DOMPurify API monaco never calls. monaco passes
# config per-call to purify.sanitize() and calls purify.removeAllHooks() in a
# finally, so none of the cross-call config persistence these bugs rely on
# happens. Verified against the vendored source, not just the package.json.
#
# Re-evaluate when monaco-editor > 0.56.0 ships with a newer bundled DOMPurify.

[[IgnoredVulns]]
id = "GHSA-cmwh-pvxp-8882"
ignoreUntil = 2026-11-01
# Needs setConfig() to pollute ALLOWED_ATTR across calls. The only setConfig
# occurrences in monaco's esm/ are DOMPurify's own definition plus unrelated
# same-named methods in the TypeScript language service and monaco's own
# configuration layer. DOMPurify.setConfig is never invoked.
reason = "monaco vendors its own DOMPurify; flagged node_modules copy is never imported; setConfig() never called"

[[IgnoredVulns]]
id = "GHSA-c2j3-45gr-mqc4"
ignoreUntil = 2026-11-01
# Needs CUSTOM_ELEMENT_HANDLING to be configured for the afterSanitizeElements
# bypass. The identifier appears only inside the vendored dompurify.js; monaco
# never sets it.
reason = "monaco vendors its own DOMPurify; flagged node_modules copy is never imported; CUSTOM_ELEMENT_HANDLING never configured"

[[IgnoredVulns]]
id = "GHSA-vxr8-fq34-vvx9"
ignoreUntil = 2026-11-01
# Needs a Trusted Types policy to survive clearConfig() and poison a later
# RETURN_TRUSTED_TYPE call. monaco does use RETURN_TRUSTED_TYPE, but the sole
# clearConfig occurrence in esm/ is DOMPurify's own definition; monaco never
# calls it, so no config survives between sanitize() calls.
reason = "monaco vendors its own DOMPurify; flagged node_modules copy is never imported; clearConfig() never called"
