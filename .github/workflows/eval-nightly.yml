name: Skill Eval (nightly)

# Generative text-to-CAD eval of the brepjs-verify SKILL.md. Each night: author parts with the model
# for the bench prompt corpus, run the bounded build -> verify -> edit loop, score the two signals
# (objective `auto` + multimodal `judge`), and push the scorecard (first-try vs eventual `both%` plus
# the failure-mode breakdown) to Langfuse for trend tracking.
#
# This is a TREND, not a gate: it lives in its own workflow, is never part of the Required-checks
# aggregate, and the eval step is `continue-on-error` so a low score (or a flaky run) RECORDS rather
# than fails. It is billed (Anthropic for author+judge; Langfuse ingestion is well within budget).
# The free deterministic gate (`npm run eval` / bench/run.ts) is unchanged and untouched by this.

on:
  schedule:
    - cron: '0 7 * * *' # 07:00 UTC daily
  workflow_dispatch:
    inputs:
      model:
        description: 'Model under test (authors the CAD)'
        required: false
        type: string
        default: claude-opus-4-8
      judge_model:
        description: 'Model that grades the rendered parts'
        required: false
        type: string
        default: claude-sonnet-4-6
      max_attempts:
        description: 'Max attempts per prompt (N)'
        required: false
        type: string
        default: '3'

# One run at a time — bounds peak WASM memory (vision §C) and avoids a same-night manual+scheduled overlap.
concurrency:
  group: skill-eval-nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # This is a tracking job and must never turn `main` red. A missing ANTHROPIC_API_KEY (or a failed
      # build) WARNS and SKIPS the eval rather than failing — the problem stays visible (a yellow
      # annotation + the job summary), it just doesn't red the run.
      - name: Check eval prerequisites
        id: pre
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "run_eval=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Skill eval skipped::ANTHROPIC_API_KEY is not configured — skipping the nightly skill eval (not a failure; add the repo secret to enable it)."
            echo "run_eval=false" >> "$GITHUB_OUTPUT"
          fi

      # npm ci + scripts/ensure-wasm.sh (both with 3x retry). Installs puppeteer too.
      - uses: ./.github/actions/setup
        if: steps.pre.outputs.run_eval == 'true'

      # The judge renders snapshots via the built WASM viewer, and the sandbox spawns the built CLI:
      # root -> viewer -> verify (the viewer worker imports `brepjs`, so the root dist must exist first).
      - name: Build CLI + viewer
        if: steps.pre.outputs.run_eval == 'true'
        run: |
          npm run build
          npm run build --workspace=brepjs-viewer
          npm run build --workspace=brepjs-verify

      # If the build produced no viewer/CLI dist (e.g. the WASM restore exhausted its retries), WARN
      # and skip the eval — don't red the run, and don't run a silent all-`judge:—` scorecard.
      - name: Check build artifacts
        id: build
        if: steps.pre.outputs.run_eval == 'true'
        run: |
          if [ -d packages/brepjs-verify/viewer/dist ] && [ -f packages/brepjs-verify/dist/cli/main.js ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Skill eval skipped::viewer/dist or dist/cli/main.js missing (build / WASM restore failed) — skipping the eval."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      # puppeteer is installed by `npm ci`; fetch the Chrome binary it drives.
      - name: Install Chrome for Puppeteer
        if: steps.pre.outputs.run_eval == 'true' && steps.build.outputs.ok == 'true'
        working-directory: packages/brepjs-verify
        run: npx puppeteer browsers install chrome

      # Records, never gates — a low both% or a flaky judge (or any harness error) must not red the run.
      - name: Run skill eval
        id: eval
        if: steps.pre.outputs.run_eval == 'true' && steps.build.outputs.ok == 'true'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          # The v5 SDK reads LANGFUSE_BASE_URL (then LANGFUSE_BASEURL) — NOT LANGFUSE_HOST (a v2/Python name).
          LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
          # Pass dispatch inputs via env (never interpolate ${{ }} into the run: shell) to avoid
          # command injection; quote on use.
          EVAL_MODEL: ${{ inputs.model || 'claude-opus-4-8' }}
          EVAL_JUDGE_MODEL: ${{ inputs.judge_model || 'claude-sonnet-4-6' }}
          EVAL_MAX_ATTEMPTS: ${{ inputs.max_attempts || '3' }}
        run: |
          npm run eval:live -w brepjs-verify -- \
            --model "$EVAL_MODEL" \
            --judge-model "$EVAL_JUDGE_MODEL" \
            --max-attempts "$EVAL_MAX_ATTEMPTS" \
            | tee scorecard.txt

      - name: Publish scorecard to the job summary
        if: always()
        env:
          RUN_EVAL: ${{ steps.pre.outputs.run_eval }}
          BUILD_OK: ${{ steps.build.outputs.ok }}
        run: |
          {
            echo '### brepjs-verify skill eval'
            if [ "$RUN_EVAL" != 'true' ]; then
              echo '_Skipped — ANTHROPIC_API_KEY not configured._'
            elif [ "$BUILD_OK" != 'true' ]; then
              echo '_Skipped — viewer/CLI build artifacts missing._'
            else
              echo '```'
              cat scorecard.txt 2>/dev/null || echo '(no scorecard produced — check the eval step log)'
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scorecard artifact
        if: steps.pre.outputs.run_eval == 'true' && steps.build.outputs.ok == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skill-eval-scorecard
          path: scorecard.txt
          retention-days: 14
