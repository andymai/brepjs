name: OSV Scan

# Complements the Dependabot cooldown: cooldown blocks fresh-but-untrusted
# in PR proposals, OSV catches old-but-known-bad in the lockfile.
# PRs are report-only; main + weekly schedule fail closed.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Don't cancel in-progress main/schedule scans — a rapid second push would
  # otherwise leave the older commit's lockfile unscanned.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  scan-pr:
    name: OSV Scan (report-only)
    if: github.event_name == 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0
    with:
      scan-args: |-
        --lockfile=package-lock.json
    permissions:
      actions: read
      contents: read
      security-events: write

  scan-main:
    name: OSV Scan (blocking)
    if: github.event_name != 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0
    with:
      scan-args: |-
        --lockfile=package-lock.json
    permissions:
      actions: read
      contents: read
      security-events: write
