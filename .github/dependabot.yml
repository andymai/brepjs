version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
    ignore:
      # opentype.js 1.3.5 and 2.0.0 throw on GSUB lookup type 6 substFormat 2 used by
      # DejaVu Sans / Noto Sans for ccmp glyph composition — breaks textBlueprints /
      # textMetrics with system fonts. (1.3.5 was an accidental prerelease of 2.0.0;
      # both ship the same code.) Re-allow once opentype.js supports this lookup format.
      - dependency-name: opentype.js
        versions: ['1.3.5', '2.x']
      # TypeScript 7 cannot resolve: typescript-eslint (through 8.65.0) declares a peer
      # range of >=4.8.4 <6.1.0, and typedoc 0.28.x conflicts the same way, so `npm
      # install` fails with ERESOLVE before any job runs. Re-allow once both widen their
      # peer ranges to accept 7.x.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # knip 6.28.0 (webpro-nl/knip#1895) started reporting unused re-exports when
      # `ignoreExportsUsedInFile` is set. That flags 74 exports + 42 exported types
      # across the barrel files that make up the public API surface (src/*/index.ts
      # re-exported through src/index.ts), so `npm run knip` fails. Adopting the
      # stricter reporting is a deliberate triage of knip.config.ts, not a bump.
      # Re-allow once that config work is done.
      - dependency-name: knip
        update-types:
          ['version-update:semver-minor', 'version-update:semver-major']
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
